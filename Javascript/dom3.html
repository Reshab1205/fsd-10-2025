<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="inp" type="text" placeholder="Enter Your Todo here ..." />
    <button onclick="addTodo()">Add Todo</button>
    <h2 id="h2">Todos :- </h2>
    <!-- <p id="demo"></p> -->
    <ul id="El">
        <!-- <li></li> -->
    </ul>

    <script>

      let data = []
      const ul = document.getElementById('El')
      const li = document.createElement('li')
      const editBTn = document.createElement('button')
      const delBTn = document.createElement('button')
        function addTodo() {
          const todo = document.getElementById('inp').value
          if(todo.trim() === "") {
            alert("Please Write Something")
            return
          }
          li.textContent = todo
          data.push(todo)
          localStorage.setItem('data', JSON.stringify(data))
          editBTn.textContent = "Edit"
          editBTn.onclick = function () {
           const editData =  prompt('Enter your New Data');
           if(editData.trim() !== "") {
             li.firstChild.textContent = editData
           }
          }
          delBTn.textContent = 'Delete'
          delBTn.onclick = function () {
            ul.removeChild(li)
            // li.remove 
          }
          // ul.appendChild(li)
          // li.appendChild(editBTn)
          // li.appendChild(delBTn)
          document.getElementById('inp').value = ""
          displayTodo()
        }

        function displayTodo() {
          const todoData = JSON.parse(localStorage.getItem('data'))
          console.log(typeof todoData)
          for(i in todoData) {
            console.log(todoData[i])
          }
        }
    </script>
</body>
</html>
