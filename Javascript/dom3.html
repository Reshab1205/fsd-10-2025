<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input id="inp" type="text" placeholder="Enter Your Todo here ..." />
    <!-- <input type="file" />
    <input id="p1" type="range" /> -->
    <button onclick="addTodo()">Add Todo</button>
    <h2 id="h2">Todos :-</h2>
    <!-- <p id="demo"></p> -->
    <ul id="El">
      <!-- <li></li> -->
    </ul>

    <script>
      if(a == 2 && b ==3) {
        console.log('True')
      }
      let data = [];
      const ul = document.getElementById("El");
      function addTodo() {
        const todo = document.getElementById("inp").value;
        if (todo.trim() === "") {
          alert("Please Write Something");
          return;
        }
        data.push(todo);
        console.log('data', data)
        localStorage.setItem("data", JSON.stringify(data));
        document.getElementById("inp").value = "";
        displayTodo();
      }

      function displayTodo() {
        const todoData = JSON.parse(localStorage.getItem("data")) || [];
        console.log(todoData)
        // console.log(li)
        const editBtn = document.createElement('button')
        editBtn.textContent = 'Edit'
        const delBtn = document.createElement('button')
        delBtn.textContent = 'Delete'
        for (let i =0; i < todoData.length; i++) {
          const li = document.createElement("li");
          li.textContent = todoData[i];
          li.appendChild(editBtn)
          li.appendChild(delBtn)
          ul.appendChild(li);
        }
      }
      displayTodo();
    </script>
  </body>
</html>
