<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input id="inp" type="text" placeholder="Enter Your Todo here ..." />
  
    <button onclick="addTodo()">Add Todo</button>
    <h2 id="h2">Todos :-</h2>
    <ul id="El">
    </ul>

    <script>
      
      let data = JSON.parse(localStorage.getItem('data')) || [];
      function addTodo() {
        const todo = document.getElementById("inp").value;
        if (todo.trim() === "") {
          alert("Please Write Something");
          return;
        }
        data.push({todo:todo, completed:false});
        localStorage.setItem("data", JSON.stringify(data));
        document.getElementById("inp").value = "";
        displayTodo();
      }
      
      function displayTodo() {
        const ul = document.getElementById("El");
        ul.innerHTML = ""
        for (let i =0; i < data.length; i++) {
          const checkbox = document.createElement('input')
          checkbox.type = 'checkbox'
          checkbox.checked = data[i].completed
          checkbox.onchange = function () {
            data[i].completed = checkbox.checked
            console.log(checkbox.checked)
            if(checkbox.checked === true) {
              span.style.textDecoration = 'line-through'
            } else {
              span.style.textDecoration = 'none'
            }
            localStorage.setItem('data', JSON.stringify(data))
          }

          

          const li = document.createElement("li"); 
          const span = document.createElement("span")
          span.textContent = data[i].todo
          const editBtn = document.createElement("button")
          editBtn.textContent = 'Edit'
          editBtn.onclick = function () {
            if(data[i].completed === true) {
              alert('Task cannot be edited.')
              return
            }
            const newData = prompt('Enter New Data', data[i].todo)
            if(newData !== "" && newData !== null) {
              data[i].todo = newData
              localStorage.setItem('data', JSON.stringify(data))
              displayTodo()
            }
          }
          const delBtn = document.createElement("button")
          delBtn.textContent = 'Delete'
          delBtn.onclick = function () {
            data.splice(i,1)
            localStorage.setItem('data', JSON.stringify(data))
            displayTodo()
          }
          li.appendChild(checkbox)
          li.appendChild(span);
          li.appendChild(editBtn)
          li.appendChild(delBtn)
          ul.appendChild(li);
        }
      }
     window.onload =  displayTodo;
    </script>
  </body>
</html>
