<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input id="inp" type="text" placeholder="Enter Your Todo here ..." />
    <!-- <input type="file" />
    <input id="p1" type="range" /> -->
    <button onclick="addTodo()">Add Todo</button>
    <h2 id="h2">Todos :-</h2>
    <!-- <p id="demo"></p> -->
    <ul id="El">
      <!-- <li></li> -->
    </ul>

    <script>
      
      let data = JSON.parse(localStorage.getItem('data')) || [];
      function addTodo() {
        const todo = document.getElementById("inp").value;
        if (todo.trim() === "") {
          alert("Please Write Something");
          return;
        }
        data.push(todo);
        localStorage.setItem("data", JSON.stringify(data));
        document.getElementById("inp").value = "";
        displayTodo();
        // data = []
      }
      
      function displayTodo() {
        const ul = document.getElementById("El");
        ul.innerHTML = ""
        for (let i =0; i < data.length; i++) {
          const li = document.createElement("li"); 
          const span = document.createElement("span")
          span.textContent = data[i]
          const editBtn = document.createElement("button")
          editBtn.textContent = 'Edit'
          editBtn.onclick = function () {
            const newData = prompt('Enter New Data', data[i])
            if(newData !== "" && newData !== null) {
              data[i] = newData
              localStorage.setItem('data', JSON.stringify(data))
              displayTodo()
            }
          }
          const delBtn = document.createElement("button")
          delBtn.textContent = 'Delete'
          delBtn.onclick = function () {
            data.splice(i,1)
            localStorage.setItem('data', JSON.stringify(data))
            displayTodo()
          }
          li.appendChild(span);
          li.appendChild(editBtn)
          li.appendChild(delBtn)
          ul.appendChild(li);
        }
      }
     window.onload =  displayTodo;
    </script>
  </body>
</html>
